  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d5e"/><stop offset="1" stop-color="#ffb86b"/>
    </linearGradient>
    <style>
      .t { font: 700 30px 'Segoe UI', 'Noto Sans TC', sans-serif; fill: #2a1530; }
