<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 252" width="800" height="252" role="img" aria-label="GitHub 活動統計">
  <title>GitHub 活動統計</title>
  <defs>
    <style>
      .card { fill: #fff6ef; stroke: #ecd6d0; }
      .num { font: 700 36px 'Segoe UI', 'Noto Sans TC', sans-serif; fill: #2a1530; }
      .label { font: 400 15px 'Segoe UI', 'Noto Sans TC', sans-serif; fill: #5a4660; }
      .legend { font: 400 14px 'Segoe UI', 'Noto Sans TC', sans-serif; fill: #2a1530; }
      .cap { font: 600 13px 'Segoe UI', 'Noto Sans TC', sans-serif; fill: #c2410c; letter-spacing: 2px; }
      @media (prefers-color-scheme: dark) {
        .card { fill: #1b1428; stroke: #3a2848; }
        .num { fill: #fff4ec; }
        .label { fill: #d9c9d8; }
        .legend { fill: #fff4ec; }
        .cap { fill: #ffb86b; }
      }
    </style>
    <clipPath id="round"><rect x="40" y="144" width="720" height="14" rx="7"/></clipPath>
  </defs>
  <rect x="1" y="1" width="798" height="250" rx="16" class="card" stroke-width="1"/>
  <text x="40" y="64" class="num">18</text><text x="40" y="90" class="label">公開儲存庫</text><text x="280" y="64" class="num">11</text><text x="280" y="90" class="label">Stars</text><text x="520" y="64" class="num">15</text><text x="520" y="90" class="label">Followers</text>
  <text x="40" y="134" class="cap">LANGUAGES BY REPOSITORY</text>
  <g clip-path="url(#round)"><rect x="40.0" y="144" width="405.0" height="14" fill="#ff4d5e"/><rect x="445.0" y="144" width="225.0" height="14" fill="#ffb86b"/><rect x="670.0" y="144" width="45.0" height="14" fill="#b57bff"/><rect x="715.0" y="144" width="45.0" height="14" fill="#5ad1c1"/></g>
  <circle cx="46" cy="193" r="6" fill="#ff4d5e"/><text x="60" y="198" class="legend">Python 56%</text><circle cx="286" cy="193" r="6" fill="#ffb86b"/><text x="300" y="198" class="legend">JavaScript 31%</text><circle cx="526" cy="193" r="6" fill="#b57bff"/><text x="540" y="198" class="legend">COBOL 6%</text><circle cx="46" cy="219" r="6" fill="#5ad1c1"/><text x="60" y="224" class="legend">HTML 6%</text>
</svg>
